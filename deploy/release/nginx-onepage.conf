# OnePage: reverse proxy. Goes into /etc/nginx/conf.d/onepage.conf
# (or /etc/nginx/sites-available/ + a symlink, depending on the distribution).
#
# The proxy is mandatory, not just desirable: OnePage listens on HTTP at 127.0.0.1:8000 (OP_BIND=127.0.0.1, OP_PUBLIC_PORT in .env)
# and does not terminate TLS. Without HTTPS the session cookie does not get Secure, and without it
# the sandboxed dashboard iframe (opaque origin, cross-site request) does not get the cookie
# at all: every report will show "Session expired".

server {
    listen 80;
    server_name onepage.example.com;
    # The internal network is usually all HTTPS anyway, but a redirect is cheaper than an argument.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name onepage.example.com;

    ssl_certificate     /etc/ssl/certs/onepage.example.com.crt;
    ssl_certificate_key /etc/ssl/private/onepage.example.com.key;

    # Reports can be tens of megabytes, both on upload and on download.
    client_max_body_size 64m;

    # Pre-compressed bodies (br/zstd/gzip) are served by OnePage itself, which sets
    # Content-Encoding. nginx must not try to compress them again.
    gzip off;
    proxy_set_header Accept-Encoding $http_accept_encoding;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Without this the perf and audit logs get the proxy's address, not the client's.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # This is how uvicorn learns that the outside is https.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Heavy reports take longer than the default 60 s to render and compress.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # Stream the response: OnePage streams large bodies in chunks, and
        # buffering would undo that, adding latency to the first byte.
        proxy_buffering off;
    }
}

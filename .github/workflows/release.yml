name: Release image

# Publishes the container image to GitHub Container Registry when a release is
# published, so a server with internet can `docker pull` it. The offline
# archive attached to the release is built separately (deploy/make-bundle.sh
# --edition release).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. 0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Version
        id: v
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          git rev-parse --short HEAD > app/BUILD

      # The browser-side Python runtime is not in git and is kept out of the
      # build context by .dockerignore; it travels as a named build context,
      # exactly as in deploy/make-bundle.sh. With it inside the image, report
      # generators work with no internet.
      - name: Fetch Pyodide
        run: |
          python deploy/fetch-pyodide.py
          mkdir -p "$RUNNER_TEMP/engine-assets"
          cp -R static/pyodide "$RUNNER_TEMP/engine-assets/pyodide"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          build-contexts: |
            engine-assets=${{ runner.temp }}/engine-assets
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

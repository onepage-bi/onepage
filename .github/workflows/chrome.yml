name: Chrome tests

# CDP-driven browser tests are flaky by nature, so they run on a schedule and
# by hand instead of gating pull requests. continue-on-error keeps a flake
# from painting the repository badge red; drop it once the suite proves
# stable for a few weeks.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # NOT continue-on-error on the job: this is the only job in the workflow,
    # so marking it would make the whole run incapable of reporting failure —
    # a browser suite whose result can never be red. The tolerance belongs on
    # the one flaky step (below), so the rest of the workflow still fails
    # loudly when it is broken rather than merely flaky.
    env:
      CHROME_BIN: /usr/bin/google-chrome
      OP_TEST_CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install requirements
        run: pip install -r requirements.txt python-calamine==0.9.0 websockets
      # The engine files are gitignored; chrome tests of /explore need them.
      - name: Fetch browser engine files
        run: |
          python deploy/fetch-pyodide.py
          python deploy/fetch-duckdb-wasm.py
      - name: Chrome version
        # CDP tests are flaky; a red badge in the first week after publication
        # costs more than a missed regression. Remove once they stabilise.
        continue-on-error: true
        run: ${CHROME_BIN} --version
      - name: Chrome smokes
        run: python tests/run_all.py --only chrome --chrome --junit junit-chrome.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-chrome
          path: junit-chrome.xml
          if-no-files-found: ignore

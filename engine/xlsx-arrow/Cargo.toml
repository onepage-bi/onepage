[package]
name = "xlsx-arrow"
version = "0.1.0"
edition = "2021"
description = "Excel sheet -> Arrow IPC stream, compiled to wasm for OnePage /explore v2"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No "dates" feature on purpose: it pulls chrono, and chrono on
# wasm32-unknown-unknown drags in a clock/JS shim we have no use for.
# `ExcelDateTime::to_ymd_hms_milli()` + `as_f64()` are chrono-free and give us
# everything (see src/sheet.rs::days_from_civil).
calamine = { version = "0.36", default-features = false }
arrow-array = { version = "59", default-features = false }
arrow-buffer = { version = "59", default-features = false }
arrow-schema = { version = "59", default-features = false }
arrow-ipc = { version = "59", default-features = false }
unicode-normalization = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

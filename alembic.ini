# Alembic, developer CLI entry point. Run from the repository root:
#
#     alembic revision --autogenerate -m "..."
#     alembic upgrade head
#     alembic downgrade -1
#
# The running app does NOT read this file — app/services/migrate.py builds its
# own Config in code, so the container needs no ini at all. That is also why
# the migration environment lives under app/ instead of a top-level alembic/:
# the Dockerfile copies app/ (and deploy/make-patch.sh ships app/), so the
# revisions travel with the code they belong to.
#
# The database URL is NOT set here on purpose: env.py takes the engine from
# app.database, so the CLI always talks to the same OP_DB_PATH the app uses.

[alembic]
script_location = app/migrations
prepend_sys_path = .
# Revision files are named 0001_..., 0002_... — chronological by eye.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
